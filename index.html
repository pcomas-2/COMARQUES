    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%);
            min-height: 100vh;
            color: #1e293b;
            padding: 20px;
            user-select: none;
        }

        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 2.2rem; color: #0369a1; text-shadow: 2px 2px 0px #bae6fd; display: flex; align-items: center; justify-content: center; gap: 10px; }
        header p { color: #475569; font-size: 1.1rem; margin-top: 5px; }

        .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; max-width: 1400px; margin: 0 auto; }
        @media (max-width: 992px) { .main-layout { grid-template-columns: 1fr; } }

        .map-card { background: #ffffff; border-radius: 20px; padding: 15px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); position: relative; }

        .map-controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            background: #f8fafc; 
            padding: 10px 16px; 
            border-radius: 12px; 
            border: 1px solid #cbd5e1; 
        }

        .map-wrapper { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 1024 / 780;
            border-radius: 12px; 
            overflow: hidden; 
            border: 2px solid #bae6fd; 
            background-color: #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-image { 
            width: 100%; 
            height: 100%; 
            object-fit: contain;
            display: block; 
        }
